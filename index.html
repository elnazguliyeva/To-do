<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>To-Do App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         LOGIN / REGISTER
    ========================== -->

    <div class="auth-container" id="authContainer">

        <div class="auth-box">

            <h1>📝 To-Do App</h1>

            <!-- LOGIN -->

            <div id="loginSection">

                <h2>Login</h2>

                <input
                    type="text"
                    id="loginUsername"
                    placeholder="Username"
                >

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Password"
                >

                <button id="loginButton">
                    Login
                </button>

                <p>
                    Hesabınız yoxdur?
                    <button
                        class="link-button"
                        id="showRegister"
                    >
                        Register
                    </button>
                </p>

            </div>


            <!-- REGISTER -->

            <div id="registerSection" class="hidden">

                <h2>Register</h2>

                <input
                    type="text"
                    id="registerUsername"
                    placeholder="Username"
                >

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Password"
                >

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm Password"
                >

                <button id="registerButton">
                    Register
                </button>

                <p>
                    Artıq hesabınız var?
                    <button
                        class="link-button"
                        id="showLogin"
                    >
                        Login
                    </button>
                </p>

            </div>


            <p id="message"></p>

        </div>

    </div>


    <!-- =========================
         TODO APP
    ========================== -->

    <div
        class="todo-container hidden"
        id="todoContainer"
    >

        <div class="todo-header">

            <div>

                <h1>📝 My To-Do List</h1>

                <p>
                    Xoş gəlmisiniz,
                    <strong id="usernameDisplay"></strong>
                </p>

            </div>

            <button id="logoutButton">
                Logout
            </button>

        </div>


        <!-- TASK INPUT -->

        <div class="input-area">

            <input
                type="text"
                id="taskInput"
                placeholder="Yeni tapşırıq yaz..."
            >

            <button id="addButton">
                Əlavə et
            </button>

        </div>


        <!-- TASK LIST -->

        <ul id="taskList"></ul>

    </div>


    <!-- JAVASCRIPT -->

    <script src="script.js"></script>

</body>
</html>
